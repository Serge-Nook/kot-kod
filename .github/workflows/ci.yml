name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
